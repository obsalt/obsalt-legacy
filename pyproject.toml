[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-workspace"
version = "0.2.0"
description = "obsalt monorepo workspace (install packages/*)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/obsalt/src",
  "packages/obsalt-testkit/src",
  "packages/obsalt-example/src",
  "packages/obsalt-vapi/src",
  "packages/obsalt-retell/src",
  "packages/obsalt-elevenlabs/src",
  "packages/obsalt-cartesia/src",
  "packages/obsalt-openai-realtime/src",
  "packages/obsalt-gemini-live/src",
  "packages/obsalt-pipecat/src",
  "packages/obsalt-livekit/src",
]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: needs docker compose services",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["obsalt", "obsalt_testkit", "obsalt_example", "obsalt_vapi", "obsalt_retell"]
mypy_path = "packages/obsalt/src:packages/obsalt-testkit/src:packages/obsalt-example/src:packages/obsalt-vapi/src:packages/obsalt-retell/src"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.setuptools]
packages = []
