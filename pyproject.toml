[project]
name = "obsalt-workspace"
version = "0.0.0"
description = "Development workspace for obsalt core and plugins"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "hypothesis>=6.112.0",
  "pre-commit>=4.0.0",
  "types-jsonschema>=4.23.0",
  "types-redis>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/obsalt/src",
  "packages/obsalt-testkit/src",
  "packages/obsalt-example/src",
  "packages/obsalt-vapi/src",
  "packages/obsalt-retell/src",
  "packages/obsalt-elevenlabs/src",
  "packages/obsalt-cartesia/src",
  "packages/obsalt-openai-realtime/src",
  "packages/obsalt-gemini-live/src",
  "packages/obsalt-pipecat/src",
  "packages/obsalt-livekit/src",
]
addopts = "-q --strict-markers"
markers = [
  "unit: isolated function tests",
  "integration: cross-component tests that stay on memory doubles",
  "blackbox: HTTP API observed only through status codes and JSON",
  "contract: OTLP, SSRF, and storage SQL contracts",
  "conformance: plugin conformance kit",
  "property: assembler permutation and fold properties",
  "security: auth, tenancy, and SSRF",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  # starlette's custom category subclasses UserWarning so it stays visible;
  # it fires from fastapi.testclient importing starlette.testclient.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle. I: import order. B: bugbear. UP: pyupgrade.
# Keep this set small and enforced. Do not add a rule family until the tree is clean.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "obsalt",
  "obsalt_testkit",
  "obsalt_example",
  "obsalt_vapi",
  "obsalt_retell",
  "obsalt_elevenlabs",
  "obsalt_cartesia",
  "obsalt_openai_realtime",
  "obsalt_gemini_live",
  "obsalt_pipecat",
  "obsalt_livekit",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["obsalt", "obsalt_testkit", "obsalt_example", "obsalt_vapi", "obsalt_retell"]
mypy_path = "packages/obsalt/src:packages/obsalt-testkit/src:packages/obsalt-example/src:packages/obsalt-vapi/src:packages/obsalt-retell/src"
ignore_missing_imports = true
