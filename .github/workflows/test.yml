name: test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check packages tests
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest
      - name: Schema fixtures
        run: pytest tests/conformance
