name: test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e packages/obsalt
          pip install -e packages/obsalt-testkit
          pip install -e packages/obsalt-example
          pip install -e packages/obsalt-vapi
          pip install -e packages/obsalt-retell
          pip install -e packages/obsalt-elevenlabs
          pip install -e packages/obsalt-cartesia
          pip install -e packages/obsalt-openai-realtime
          pip install -e packages/obsalt-gemini-live
          pip install -e packages/obsalt-pipecat
          pip install -e packages/obsalt-livekit
          pip install pytest ruff mypy
      - name: Lint
        run: ruff check packages tests
      - name: Type-check
        continue-on-error: true
        run: mypy packages/obsalt/src/obsalt packages/obsalt-testkit/src/obsalt_testkit packages/obsalt-example/src/obsalt_example packages/obsalt-vapi/src/obsalt_vapi packages/obsalt-retell/src/obsalt_retell
      - name: Test
        run: pytest
