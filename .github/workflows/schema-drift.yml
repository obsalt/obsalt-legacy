name: Schema drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: schema-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Compare vendored pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --all-packages
      - name: Offline vendored pin check
        run: uv run obsalt schema-drift --all
      - name: Note
        run: >
          echo "This job stays reproducible unless a refetched --remote schema is
          supplied. Updating a pin requires a reviewed schema, fixture, and
          expected-output diff. Pull requests already run the offline check in CI."
