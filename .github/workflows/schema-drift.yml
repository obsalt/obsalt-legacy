name: schema-drift
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e packages/obsalt
          pip install -e packages/obsalt-testkit
          pip install -e packages/obsalt-example
          pip install -e packages/obsalt-vapi
          pip install -e packages/obsalt-retell
          pip install -e packages/obsalt-elevenlabs
          pip install -e packages/obsalt-cartesia
      - name: Offline vendored pin check
        run: python -m obsalt schema-drift --all
      - name: Note
        run: echo "This scheduled job stays reproducible unless a refetched --remote schema is supplied. Updating a pin requires a reviewed schema, fixture, and expected-output diff."
