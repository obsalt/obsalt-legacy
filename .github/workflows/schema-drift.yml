name: Schema drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: schema-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Compare vendored pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/**/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
      - name: Offline vendored pin check
        run: python -m obsalt schema-drift --all
      - name: Note
        run: >
          echo "This job stays reproducible unless a refetched --remote schema is
          supplied. Updating a pin requires a reviewed schema, fixture, and
          expected-output diff. Pull requests already run the offline check in CI."
