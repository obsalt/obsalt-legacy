name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Check
        run: uv run ruff check packages tests
      - name: Format
        run: uv run ruff format --check packages tests

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages
      - name: mypy
        id: mypy
        continue-on-error: true
        run: uv run mypy
      - name: Informational
        run: |
          if [ "${{ steps.mypy.outcome }}" = "failure" ]; then
            echo "::warning::Strict mypy still has a pre-existing backlog. Lint and tests are the required gates."
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-packages --python ${{ matrix.python-version }}
      - name: Pytest
        run: uv run pytest --maxfail=1
      - name: Vendored schema pins
        run: uv run obsalt schema-drift --all

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint and tests
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          echo "typecheck=${{ needs.typecheck.result }}"
