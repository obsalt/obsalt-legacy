services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: obsalt
      POSTGRES_PASSWORD: obsalt
      POSTGRES_DB: obsalt
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/obsalt/src/obsalt/store/sql/postgres.sql:/docker-entrypoint-initdb.d/01.sql:ro
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]
    volumes:
      - chdata:/var/lib/clickhouse
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: obsalt
      MINIO_ROOT_PASSWORD: obsalt-secret
    ports: ["9010:9000", "9001:9001"]
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  chdata:
  miniodata:
