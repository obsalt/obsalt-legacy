# Supported path. There is no Postgres-only production mode.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: obsalt
      POSTGRES_PASSWORD: obsalt
      POSTGRES_DB: obsalt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsalt"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: obsalt
      CLICKHOUSE_USER: obsalt
      CLICKHOUSE_PASSWORD: obsalt
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: obsalt
      MINIO_ROOT_PASSWORD: obsalt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  obsalt:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -c "pip install -q -e packages/obsalt -e packages/obsalt-example
      -e packages/obsalt-vapi -e packages/obsalt-retell &&
      obsalt serve --host 0.0.0.0 --port 8080"
    volumes:
      - .:/app
    environment:
      OBSALT_POSTGRES_DSN: postgresql://obsalt:obsalt@postgres:5432/obsalt
      OBSALT_CLICKHOUSE_URL: http://clickhouse:8123
      OBSALT_REDIS_URL: redis://redis:6379/0
      OBSALT_S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  pgdata:
  chdata:
  miniodata:
