[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-pipecat"
version = "0.0.0"
description = "Pipecat convention mapper and optional observer for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==0.0.0"]

[project.entry-points."obsalt.plugins"]
pipecat = "obsalt_pipecat.plugin:PipecatPlugin"

[tool.uv.sources]
obsalt = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_pipecat = ["py.typed", "fixtures/**/*"]
