[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-livekit"
version = "0.0.0"
description = "LiveKit convention mapper for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==0.0.0"]

[project.entry-points."obsalt.plugins"]
livekit = "obsalt_livekit.plugin:LiveKitPlugin"

[tool.uv.sources]
obsalt = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_livekit = ["py.typed", "fixtures/**/*"]
