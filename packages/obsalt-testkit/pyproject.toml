[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-testkit"
version = "0.2.0"
description = "Conformance test base classes for obsalt plugins"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "obsalt==0.2.0",
  "pytest>=8.3.0",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "mypy>=1.13.0"]

[project.scripts]
obsalt-record = "obsalt_testkit.record:main"

[tool.setuptools.packages.find]
where = ["src"]
