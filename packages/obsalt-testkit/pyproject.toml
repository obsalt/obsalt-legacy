[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-testkit"
version = "2.0.0"
description = "Conformance test base classes for obsalt plugins"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "obsalt==2.0.0",
  "pytest>=8.3.0",
  "jsonschema>=4.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_testkit = ["py.typed"]
