[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-providers-all"
version = "0.0.0"
description = "Meta-package installing all first-party obsalt source plugins"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "obsalt-vapi==0.0.0",
  "obsalt-retell==0.0.0",
  "obsalt-elevenlabs==0.0.0",
  "obsalt-cartesia==0.0.0",
  "obsalt-openai-realtime==0.0.0",
  "obsalt-gemini-live==0.0.0",
  "obsalt-pipecat==0.0.0",
  "obsalt-livekit==0.0.0",
]

[tool.uv.sources]
obsalt-vapi = { workspace = true }
obsalt-retell = { workspace = true }
obsalt-elevenlabs = { workspace = true }
obsalt-cartesia = { workspace = true }
obsalt-openai-realtime = { workspace = true }
obsalt-gemini-live = { workspace = true }
obsalt-pipecat = { workspace = true }
obsalt-livekit = { workspace = true }
