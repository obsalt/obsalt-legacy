[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-providers-all"
version = "0.2.0"
description = "Convenience bundle of first-party obsalt source plugins"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "obsalt-vapi==0.2.0",
  "obsalt-retell==0.2.0",
  "obsalt-elevenlabs==0.2.0",
  "obsalt-cartesia==0.2.0",
  "obsalt-openai-realtime==0.2.0",
  "obsalt-gemini-live==0.2.0",
  "obsalt-pipecat==0.2.0",
  "obsalt-livekit==0.2.0",
]

[tool.setuptools]
packages = []
