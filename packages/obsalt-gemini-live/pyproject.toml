[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-gemini-live"
version = "0.0.0"
description = "Gemini Live SDK instrumentation and OTLP mapper for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==0.0.0"]

[project.entry-points."obsalt.plugins"]
gemini_live = "obsalt_gemini_live.plugin:GeminiLivePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_gemini_live = ["py.typed", "fixtures/**/*"]
