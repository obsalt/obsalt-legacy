[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-retell"
version = "0.0.0"
description = "Retell hosted source plugin for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==0.0.0"]

[project.entry-points."obsalt.plugins"]
retell = "obsalt_retell.plugin:RetellPlugin"

[tool.uv.sources]
obsalt = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_retell = ["py.typed", "fixtures/**/*", "data/**/*"]
