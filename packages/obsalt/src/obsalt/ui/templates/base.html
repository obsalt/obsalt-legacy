<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}obsalt{% endblock %}</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #111; background: #fafafa; }
    body { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    a { color: #0b57d0; }
    code { background: #eee; padding: 0.1rem 0.3rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; text-align: left; padding: 0.4rem 0.5rem; vertical-align: top; }
    .banner { background: #fff3cd; border: 1px solid #e6c200; padding: 0.6rem 0.8rem; margin-bottom: 1rem; }
    .panel { background: #fff; border: 1px solid #ddd; padding: 0.8rem; margin: 1rem 0; }
    .chip { display: inline-block; background: #eef; border-radius: 999px; padding: 0.1rem 0.5rem; margin: 0.1rem; font-size: 0.85rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
<nav>
  <a href="/v1/ui">obsalt</a>
  <a href="/v1/ui/calls">Calls</a>
  <a href="/docs">API</a>
</nav>
{% block body %}{% endblock %}
</body>
</html>
