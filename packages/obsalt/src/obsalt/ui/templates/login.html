{% extends "base.html" %}
{% block title %}Login — obsalt{% endblock %}
{% block body %}
<h1>Login</h1>
{% if error %}
<div class="banner error">{{ error }}</div>
{% endif %}
<p>Service keys are hashed at rest. <code>require_auth=false</code> was deleted — unknown keys no longer collapse into the first org.</p>
<form method="post" action="/v1/ui/login">
  <label for="api_key">API key</label>
  <input id="api_key" name="api_key" type="password" autocomplete="off">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
