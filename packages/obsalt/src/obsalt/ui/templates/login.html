{% extends "base.html" %}
{% block title %}obsalt — sign in{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <p class="muted">Browser sessions use an HTTP-only SameSite cookie. Paste a hashed-at-rest API key; the key itself is not stored in the cookie.</p>
  {% if error %}
    <p class="decode_failed">{{ error }}</p>
  {% endif %}
  <form method="post" action="/v1/ui/login">
    <label>API key <input name="api_key" type="password" autocomplete="off" /></label>
    <button type="submit">Continue</button>
  </form>
{% endblock %}
