[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt"
version = "0.2.0"
description = "Self-hosted call analytics and quality system for AI voice agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "obsalt" }]
keywords = ["voice", "observability", "opentelemetry", "call-analytics"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "orjson>=3.10.0",
  "jinja2>=3.1.4",
  "cryptography>=43.0.0",
  "pyjwt>=2.9.0",
  "pynacl>=1.5.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "clickhouse-connect>=0.8.0",
  "redis>=5.2.0",
  "boto3>=1.35.0",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-proto>=1.28.0",
  "opentelemetry-semantic-conventions>=0.49b0",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
vapi = ["obsalt-vapi"]
retell = ["obsalt-retell"]
elevenlabs = ["obsalt-elevenlabs"]
cartesia = ["obsalt-cartesia"]
openai-realtime = ["obsalt-openai-realtime"]
gemini-live = ["obsalt-gemini-live"]
pipecat = ["obsalt-pipecat"]
livekit = ["obsalt-livekit"]
providers = ["obsalt-providers-all"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "hypothesis>=6.115.0",
  "jsonschema>=4.23.0",
  "types-redis>=4.6.0",
]
embed = ["onnxruntime>=1.19.0"]

[project.scripts]
obsalt = "obsalt.cli:main"

[project.urls]
Homepage = "https://github.com/coder-with-a-bushido/obsalt"
Documentation = "https://github.com/coder-with-a-bushido/obsalt/blob/main/docs/README.md"

[project.entry-points."obsalt.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt = ["ui/templates/*.html", "storage/migrations/*.sql"]
