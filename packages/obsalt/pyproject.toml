[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt"
version = "0.0.0"
description = "Self-hosted call analytics and quality system for AI voice agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "obsalt" }]
keywords = ["voice", "observability", "opentelemetry", "call-analytics"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "cryptography>=43.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-proto>=1.28.0",
  "opentelemetry-semantic-conventions>=0.49b0",
  "psycopg[binary,pool]>=3.2.0",
  "clickhouse-connect>=0.8.0",
  "redis>=5.1.0",
  "boto3>=1.35.0",
  "prometheus-client>=0.21.0",
  "jsonschema>=4.23.0",
  "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
vapi = ["obsalt-vapi==0.0.0"]
retell = ["obsalt-retell==0.0.0"]
elevenlabs = ["obsalt-elevenlabs==0.0.0"]
cartesia = ["obsalt-cartesia==0.0.0"]
openai-realtime = ["obsalt-openai-realtime==0.0.0"]
gemini-live = ["obsalt-gemini-live==0.0.0"]
pipecat = ["obsalt-pipecat==0.0.0"]
livekit = ["obsalt-livekit==0.0.0"]
providers = ["obsalt-providers-all==0.0.0"]
grpc = ["grpcio>=1.66.0"]
groundedness = [
  "torch>=2.6.0",
  "transformers>=4.48.0",
  "safetensors>=0.4.0",
]

[project.scripts]
obsalt = "obsalt.cli:main"

[project.urls]
Homepage = "https://github.com/coder-with-a-bushido/obsalt"
Documentation = "https://github.com/coder-with-a-bushido/obsalt/blob/main/docs/README.md"

[project.entry-points."obsalt.plugins"]

[tool.uv.sources]
obsalt-vapi = { workspace = true }
obsalt-retell = { workspace = true }
obsalt-elevenlabs = { workspace = true }
obsalt-cartesia = { workspace = true }
obsalt-openai-realtime = { workspace = true }
obsalt-gemini-live = { workspace = true }
obsalt-pipecat = { workspace = true }
obsalt-livekit = { workspace = true }
obsalt-providers-all = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt = ["py.typed", "store/sql/*.sql", "ui/templates/*.html", "ui/static/*"]
