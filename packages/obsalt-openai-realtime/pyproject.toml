[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-openai-realtime"
version = "2.0.0"
description = "OpenAI Realtime SDK instrumentation and OTLP mapper for obsalt"
requires-python = ">=3.11"
dependencies = ["obsalt==2.0.0"]

[project.entry-points."obsalt.plugins"]
openai_realtime = "obsalt_openai_realtime.plugin:OpenAIRealtimePlugin"

[tool.setuptools.packages.find]
where = ["src"]
