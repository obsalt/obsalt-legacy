[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-cartesia"
version = "2.0.0"
description = "Cartesia Line hosted source plugin for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==2.0.0"]

[project.entry-points."obsalt.plugins"]
cartesia = "obsalt_cartesia.plugin:CartesiaPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_cartesia = ["py.typed", "fixtures/**/*"]
