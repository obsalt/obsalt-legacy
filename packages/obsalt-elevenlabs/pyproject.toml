[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsalt-elevenlabs"
version = "2.0.0"
description = "ElevenLabs hosted source plugin for obsalt"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["obsalt==2.0.0"]

[project.entry-points."obsalt.plugins"]
elevenlabs = "obsalt_elevenlabs.plugin:ElevenLabsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsalt_elevenlabs = ["py.typed", "fixtures/**/*"]
